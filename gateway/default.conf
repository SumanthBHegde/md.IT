# Stands in for the Kubernetes Ingress (P-045): /api/ goes to the backend, the rest to the
# frontend container, whose own nginx adds the CSP and caching headers.
server {
  listen 80;
  server_name _;
  server_tokens off;
  client_max_body_size 6m;

  # Docker's DNS, re-asked every 10 s: a recreated backend or frontend (new IP) is found
  # without restarting the gateway. Variables in proxy_pass make nginx resolve at request time.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream http://backend:8000;
  set $frontend_upstream http://frontend:80;

  location /api/ {
    proxy_pass $backend_upstream;
    # The backend is on the same Docker network: connecting takes milliseconds. Without this, a
    # stopped backend's cached address makes requests hang for nginx's default 60 s.
    proxy_connect_timeout 5s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }

  location / {
    proxy_pass $frontend_upstream;
    proxy_set_header Host $http_host;
  }
}
